name: Build recovery lab
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          swiftc AgentRelay/WatchBattery.swift tests/battery/main.swift -o /tmp/watch-battery-checks
          /tmp/watch-battery-checks
          swiftc AgentRelay/WatchWire.swift tests/watch/main.swift -o /tmp/watch-wire-checks
          /tmp/watch-wire-checks
          swiftc -parse-as-library -D RELAY_HEADLESS_TEST AgentRelay/WatchWire.swift AgentRelay/BLELabCommand.swift tests/voice-lifecycle/SDKStubs.swift AgentRelay/VoiceConversationProbe.swift AgentRelay/WatchVoiceSession.swift tests/voice-lifecycle/main.swift -o /tmp/voice-lifecycle-checks
          /tmp/voice-lifecycle-checks
          swiftc -frontend -parse AgentRelay/AppDelegate.swift AgentRelay/WatchVoiceSession.swift AgentRelay/WatchAudioMerge.swift AgentRelay/SystemAudioCapture.swift AgentRelay/WearableService.swift AgentRelay/VoiceConversationProbe.swift AgentRelay/DeviceDiagnostics.swift
  build:
    needs: protocol
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        profile: [ask]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -lt 26 ]; then
            for candidate in /Applications/Xcode_26*.app; do
              if [ -d "$candidate" ]; then sudo xcode-select -s "$candidate"; break; fi
            done
          fi
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $sdk_version"
          test "${sdk_version%%.*}" -ge 26
      - name: Check command queue and phone receipts
        run: |
          swiftc AgentRelay/WatchBattery.swift tests/battery/main.swift -o /tmp/watch-battery-checks
          /tmp/watch-battery-checks
          python3 -m unittest discover -s tools -p test_ble_command_queue.py -v
          swiftc AgentRelay/BLELabCommand.swift tests/commands/main.swift -o /tmp/recovery-command-checks
          /tmp/recovery-command-checks
          swiftc AgentRelay/BLEButtonTrial.swift tests/main.swift -o /tmp/ble-existing-checks
          /tmp/ble-existing-checks
          swiftc AgentRelay/WatchWire.swift AgentRelay/WatchAudioMerge.swift tests/watch/main.swift -o /tmp/watch-checks
          /tmp/watch-checks
          swiftc AgentRelay/SystemAudioCapture.swift tests/system-audio/main.swift -o /tmp/system-audio-checks
          /tmp/system-audio-checks
      - name: Configure profile
        run: python3 tools/configure-recovery-build.py ${{ matrix.profile }}
      - name: Build unsigned app
        run: |
          xcodebuild -project AgentRelay.xcodeproj -scheme AgentRelay -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
      - name: Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AgentRelay.app Payload/
          zip -qr AgentRelay.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AgentRelay-recovery-${{ matrix.profile }}-ipa
          path: AgentRelay.ipa
