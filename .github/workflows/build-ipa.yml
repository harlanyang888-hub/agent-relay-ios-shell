name: Build iOS IPA

on:
  push:
    branches: [ main, master, wearable-poc ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          xcodebuild -project AgentRelay.xcodeproj \
            -scheme AgentRelay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AgentRelay.app Payload/
          zip -r AgentRelay.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentRelay-unsigned-ipa
          path: AgentRelay.ipa

      - name: Create / Update Pre-Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wearable-poc'
        continue-on-error: true
        with:
          tag_name: latest
          name: "Agent Relay Wearable PoC Latest"
          body: "免签名 IPA 构建产物。支持后台/锁屏下监听蓝牙耳机实体按键 PoC 验证。"
          files: AgentRelay.ipa
          prerelease: true
