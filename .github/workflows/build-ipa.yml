name: Build recovery lab
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          swiftc AgentRelay/WatchWire.swift tests/watch/main.swift -o /tmp/watch-wire-checks
          /tmp/watch-wire-checks
          swiftc -frontend -parse AgentRelay/WatchVoiceSession.swift AgentRelay/WatchAudioMerge.swift AgentRelay/WearableService.swift AgentRelay/VoiceConversationProbe.swift AgentRelay/DeviceDiagnostics.swift
  build:
    needs: protocol
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        profile: [ask]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          xcodebuild -version
      - name: Check command queue and phone receipts
        run: |
          python3 -m unittest discover -s tools -p test_ble_command_queue.py -v
          swiftc AgentRelay/BLELabCommand.swift tests/commands/main.swift -o /tmp/recovery-command-checks
          /tmp/recovery-command-checks
          swiftc AgentRelay/BLEButtonTrial.swift tests/main.swift -o /tmp/ble-existing-checks
          /tmp/ble-existing-checks
          swiftc AgentRelay/WatchWire.swift AgentRelay/WatchAudioMerge.swift tests/watch/main.swift -o /tmp/watch-checks
          /tmp/watch-checks
      - name: Configure profile
        run: python3 tools/configure-recovery-build.py ${{ matrix.profile }}
      - name: Build unsigned app
        run: |
          xcodebuild -project AgentRelay.xcodeproj -scheme AgentRelay -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
      - name: Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AgentRelay.app Payload/
          zip -qr AgentRelay.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AgentRelay-recovery-${{ matrix.profile }}-ipa
          path: AgentRelay.ipa
